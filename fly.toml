# Fly.io configuration for a hosted Sales Coach: one machine, one volume, one seller.
# Walkthrough: docs/deploy.md. Replace the two placeholders before `fly launch`.
#
# Secrets are never written here. After `fly launch --no-deploy`, set them once:
#
#   fly secrets set \
#     SALESCOACH_PASSWORD='a long passphrase' \
#     SALESCOACH_PUBLIC_URL='https://<app>.fly.dev' \
#     ANTHROPIC_API_KEY='sk-ant-...' \
#     WEBHOOK_SECRET="$(openssl rand -hex 24)"
#
# (ANTHROPIC_API_KEY is for the `anthropic` provider; use OPENAI_API_KEY, XAI_API_KEY or the key
# your OpenAI-compatible gateway needs instead. WEBHOOK_SECRET is optional: it switches the
# transcript webhook on.)

app = "REPLACE-ME-salescoach"          # your app name; also the host: https://<app>.fly.dev
primary_region = "REPLACE-ME"          # e.g. "bom" (Mumbai), "sin", "fra", "iad"; `fly platform regions`

[build]
  dockerfile = "Dockerfile"

[env]
  SALESCOACH_DATA = "/data"
  SALESCOACH_RUNTIME = "/data/runtime"
  PORT = "8140"

# One volume, mounted where everything persistent lives (the database, settings, secrets.env,
# imported transcripts, the runtime folder). A volume pins the app to one machine, which is right:
# SQLite has one writer, and the scheduler must run exactly once.
[[mounts]]
  source = "salescoach_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8140
  force_https = true
  auto_stop_machines = "off"           # the scheduler (follow-ups, reply polling) runs inside the server
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
