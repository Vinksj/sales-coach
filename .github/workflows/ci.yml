name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The only network use in this workflow. The test suite itself is offline: no model, no
      # Gmail, no calendar, no recorder API. The asr extra is not installed (MLX is Apple Silicon
      # only, and the speech tests use fakes).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (pyflakes and syntax errors)
        run: ruff check --select F,E9 .

      - name: Tests
        run: pytest -q

      # A compile check only: nothing is signed, run or granted a permission.
      - name: Build callcap (macOS)
        if: runner.os == 'macOS'
        working-directory: callcap
        run: swift build -c release

      - name: Build overlay (macOS)
        if: runner.os == 'macOS'
        working-directory: overlay
        run: swift build -c release
