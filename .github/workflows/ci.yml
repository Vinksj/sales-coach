name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The only network use in this workflow. The test suite itself is offline: no model, no
      # Gmail, no calendar, no recorder API. The asr extra is not installed (MLX is Apple Silicon
      # only, and the speech tests use fakes).
      # ffmpeg is optional for the app (audio import only); installing it here lets those tests run
      # instead of being skipped.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (pyflakes and syntax errors)
        run: ruff check --select F,E9 .

      - name: Tests
        run: pytest -q

      # A compile check only: nothing is signed, run or granted a permission.
      - name: Build callcap (macOS)
        if: runner.os == 'macOS'
        working-directory: callcap
        run: swift build -c release

      - name: Build overlay (macOS)
        if: runner.os == 'macOS'
        working-directory: overlay
        run: swift build -c release

  # The same suite against Postgres: every test that touches the store gets a schema of its own
  # (tests/conftest.py), the SQLite-only tests (migrations keyed on user_version, table rebuilds)
  # are skipped, and the schema-parity and catalog-lint tests run for real.
  postgres:
    name: Postgres, Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: salescoach_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d salescoach_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SALESCOACH_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/salescoach_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Generated Postgres baseline and RLS policies are committed
        run: |
          python scripts/gen_pg_baseline.py --check
          python scripts/gen_pg_rls.py --check

      - name: Create the app role (what a deployment does once; 0003_rls.sql grants it the tables)
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://test:test@127.0.0.1:5432/salescoach_test", autocommit=True) as c:
              c.execute("CREATE ROLE salescoach_app LOGIN PASSWORD 'salescoach_app' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE")
              c.execute("GRANT CONNECT ON DATABASE salescoach_test TO salescoach_app")
          PY

      - name: Migrate an empty database as the owner role and check it
        env:
          DATABASE_MIGRATE_URL: postgresql://test:test@127.0.0.1:5432/salescoach_test
          DATABASE_URL: postgresql://salescoach_app:salescoach_app@127.0.0.1:5432/salescoach_test
        run: |
          salescoach migrate
          salescoach migrate --check

      - name: Tests on Postgres
        run: pytest -q
